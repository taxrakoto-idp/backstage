name: Build and publish Backstage image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backstage-image.yaml'
      - '.config/**'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'app-config*.yaml'
      - 'backstage.json'
      - 'examples/**'
      - 'package.json'
      - 'packages/**'
      - 'plugins/**'
      - 'tsconfig.json'
      - 'yarn.lock'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/backstage-image.yaml'
      - '.config/**'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'app-config*.yaml'
      - 'backstage.json'
      - 'examples/**'
      - 'package.json'
      - 'packages/**'
      - 'plugins/**'
      - 'tsconfig.json'
      - 'yarn.lock'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backstage-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODE_VERSION: '24'

jobs:
  build:
    name: Validate, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type-check source
        run: yarn tsc

      - name: Build backend bundle
        run: yarn build:backend

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
